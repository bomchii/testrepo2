name: debug-curl
# Temporal: diagnosticar por que curl a run.twoyi.app falla en el runner
# (el AVISO de descargar-frontend.sh no llego a imprimirse). Se borra
# cuando el diagnostico este hecho.
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Entorno
        run: |
          bash --version | head -1
          curl --version | head -1
          env | grep -i proxy || echo "sin vars proxy"
          echo "--- curl directo a run.twoyi.app (sin -f) ---"
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" -o /tmp/idx.html -w "HTTP %{http_code} size %{size_download}\n" https://run.twoyi.app/ || echo "curl directo exit=$?"
          head -c 300 /tmp/idx.html 2>/dev/null || echo "sin index.html"
          echo
          echo "--- curl a seed.twoyi.app ---"
          curl -s -o /dev/null -w "seed rom.json HTTP %{http_code}\n" https://seed.twoyi.app/v107-gles-r1-f5a887c7/rom.json || echo "curl seed exit=$?"
      - name: Traza de descargar-frontend.sh
        run: bash -x scripts/descargar-frontend.sh || echo "script exit=$?"
