name: twoyi-boot
# Corre UN experimento del loop v3 de Twoyi Web (Android 13 en el
# navegador) en un runner GitHub-hosted (repo publico: 4 vCPU, 16 GB RAM,
# 14 GB SSD). El boot pica ~4,6 GB de RSS, asi que cabe con margen; el
# runner es una VM nueva en cada corrida, sin el globo de RAM de la VM
# local. Lanzamiento: gh workflow run twoyi-boot.yml -f experiment=G1
# (ver README-ACTIONS.md).
#
# REGLA DURA: este repo NO contiene codigo de Twoyi. El front-end
# (run.twoyi.app) y la ROM (seed v107) se DESCARGAN en tiempo de
# ejecucion desde el release privado bomchii/resources (con el token
# secreto RESOURCES_TOKEN) o se restauran del cache de Actions cuando
# el build no cambio, y NUNCA se commitean (mirror-v2/ esta en
# .gitignore). Los artefactos son SOLO salidas del harness (summary,
# consola, capturas).
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'ID del experimento (G1..G10, sondas S1A/S1B/S2S/S2B/S3/S4/S5/S5-new, re-baseline N1/N1b/N2, regimen R1/R1b/R1c, diagnostico V1, EROFS N3)'
        required: true
        default: 'G1'
        type: choice
        options: [G1, G2, G3a, G3b, G4, G5, G6a, G6b, G7, G8, G9, G10, S1A, S1B, S2S, S2B, S3, S4, S5, S5-new, R1, R1b, R1c, N1, N1b, N2, V1, N3]

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      # Los archivos de Twoyi (front-end + ROM) ya NO se bajan del sitio
      # oficial: van por el release privado bomchii/resources (tag
      # twoyi-v107), descargados con el token secreto RESOURCES_TOKEN
      # (un PAT con lectura sobre ese repo privado; el GITHUB_TOKEN por
      # defecto solo ve este repo). En hit de cache de Actions no se
      # descarga nada; en miss, la descarga viene de GitHub (sin el 429
      # de Cloudflare) y se verifica por SHA antes de extraer. El save
      # del cache es explicito tras la descarga para que un archivo
      # parcial nunca quede cacheado. Para adoptar un build nuevo, ver
      # README-ACTIONS.md.
      - name: Cache del seed v107 (ROM, 471 MB)
        id: cache-seed
        uses: actions/cache/restore@v4
        with:
          path: mirror-v2/seed.twoyi.app
          key: seed-v107-fd96c489-files

      - name: Restaurar cache del front-end
        id: cache-frontend
        uses: actions/cache/restore@v4
        with:
          path: mirror-v2/run.twoyi.app
          key: frontend-${{ hashFiles('frontend-pin.txt') }}

      - name: Descargar front-end desde resources (si no hay cache)
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.RESOURCES_TOKEN }}
        run: bash scripts/descargar-resources.sh frontend

      - name: Guardar cache del front-end
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mirror-v2/run.twoyi.app
          key: frontend-${{ hashFiles('frontend-pin.txt') }}

      - name: Descargar seed v107 desde resources (si no hay cache)
        if: steps.cache-seed.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.RESOURCES_TOKEN }}
        run: bash scripts/descargar-resources.sh seed

      # El build nuevo 5ff397fe ya NO lee rom.tar.gz por rangos: lee
      # seed.index y pide files/<n> sueltos. N1 fallo asi: 1.798
      # peticiones a files/<n>, todas 404 -> NEO_ERROR 'short ROM file',
      # exit 125, pagina atascada en 'Fetching the system image...'.
      # Los chunks viven DENTRO de rom.tar.gz (verificado en local:
      # files/10 y files/1002 byte-identicos al seed vivo), asi que se
      # extraen al arbol del seed. La clave de cache nueva (-files)
      # hace que la primera corrida tras el cambio re-descargue el seed
      # y guarde el cache YA con files/; en hits posteriores el paso es
      # un no-op (test -d). Sin --same-owner: ver descargar-resources.sh.
      - name: Extraer files/ del rom.tar.gz (build nuevo)
        run: |
          SEED=mirror-v2/seed.twoyi.app/v107-gles-r1-f5a887c7
          test -d "$SEED/files" || tar --no-same-owner -xzf "$SEED/rom.tar.gz" -C "$SEED" files
          test -f "$SEED/files/10" || { echo "FALLO: files/ no extraido en $SEED"; exit 1; }
          echo "files/ en $SEED: $(find "$SEED/files" -type f | wc -l) archivos"

      - name: Guardar cache del seed
        if: steps.cache-seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mirror-v2/seed.twoyi.app
          key: seed-v107-fd96c489-files

      # G7 (seed.copy=mirror/seed-v107-mod1): la ROM reempaquetada con
      # ro.hw_timeout_multiplier=5 es un asset del release privado
      # (seed-v107-mod1.tar.gz, rom sha 7c411366...), igual que el seed
      # stock. Solo se descarga/cachea cuando el experimento es G7.
      - name: Cache del seed mod1 (G7)
        id: cache-seed-mod1
        if: inputs.experiment == 'G7'
        uses: actions/cache/restore@v4
        with:
          path: mirror-v2/seed-v107-mod1
          key: seed-v107-mod1-7c411366-files

      - name: Descargar seed mod1 desde resources (G7, si no hay cache)
        if: inputs.experiment == 'G7' && steps.cache-seed-mod1.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.RESOURCES_TOKEN }}
        run: bash scripts/descargar-resources.sh seed-mod1

      # Igual que el seed stock: el build nuevo pide files/<n> sueltos;
      # se extraen de rom.tar.gz (mismo layout) antes de guardar el cache.
      - name: Extraer files/ del rom.tar.gz mod1 (G7)
        if: inputs.experiment == 'G7'
        run: |
          SEED=mirror-v2/seed-v107-mod1/v107-gles-r1-f5a887c7
          test -d "$SEED/files" || tar --no-same-owner -xzf "$SEED/rom.tar.gz" -C "$SEED" files
          test -f "$SEED/files/10" || { echo "FALLO: files/ no extraido en $SEED"; exit 1; }
          echo "files/ en $SEED: $(find "$SEED/files" -type f | wc -l) archivos"

      - name: Guardar cache del seed mod1 (G7)
        if: inputs.experiment == 'G7' && steps.cache-seed-mod1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mirror-v2/seed-v107-mod1
          key: seed-v107-mod1-7c411366-files

      # G9 (seed.copy=mirror/seed-v107-mod2): la ROM tanda RAM (low_ram +
      # lmk Go + heap ART) es un asset del release privado
      # (seed-v107-mod2.tar.gz, rom sha 30ad0d13...). Solo se descarga y
      # cachea cuando el experimento es G9.
      - name: Cache del seed mod2 (G9)
        id: cache-seed-mod2
        if: inputs.experiment == 'G9'
        uses: actions/cache/restore@v4
        with:
          path: mirror-v2/seed-v107-mod2
          key: seed-v107-mod2-30ad0d13-files

      - name: Descargar seed mod2 desde resources (G9, si no hay cache)
        if: inputs.experiment == 'G9' && steps.cache-seed-mod2.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.RESOURCES_TOKEN }}
        run: bash scripts/descargar-resources.sh seed-mod2

      # Igual que el seed stock: el build nuevo pide files/<n> sueltos;
      # se extraen de rom.tar.gz (mismo layout) antes de guardar el cache.
      - name: Extraer files/ del rom.tar.gz mod2 (G9)
        if: inputs.experiment == 'G9'
        run: |
          SEED=mirror-v2/seed-v107-mod2/v107-gles-r1-f5a887c7
          test -d "$SEED/files" || tar --no-same-owner -xzf "$SEED/rom.tar.gz" -C "$SEED" files
          test -f "$SEED/files/10" || { echo "FALLO: files/ no extraido en $SEED"; exit 1; }
          echo "files/ en $SEED: $(find "$SEED/files" -type f | wc -l) archivos"

      - name: Guardar cache del seed mod2 (G9)
        if: inputs.experiment == 'G9' && steps.cache-seed-mod2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mirror-v2/seed-v107-mod2
          key: seed-v107-mod2-30ad0d13-files

      # N3 (image=true en la config): la imagen EROFS del sistema
      # (system.erofs 1,11 GB, raw SHA 3726687b...) es un asset del release
      # privado (system-erofs-v107.gz, 471 MB, SHA 7797ced6...) + el worker
      # image_fetch.js del build ec4216c0 (SHA f2caf4fe...; el tarball del
      # front-end 5ff397fe NO lo trae). Solo se descarga/cachea con N3.
      # descargar-resources.sh image verifica ambos SHAs, descomprime el
      # .gz y verifica tamano raw + magia EROFS + SHA raw.
      - name: Cache de la imagen EROFS (N3)
        id: cache-image
        if: inputs.experiment == 'N3'
        uses: actions/cache/restore@v4
        with:
          path: |
            mirror-v2/image
            mirror-v2/image_fetch.js
          key: image-v107-3726687b

      - name: Descargar imagen EROFS desde resources (N3, si no hay cache)
        if: inputs.experiment == 'N3' && steps.cache-image.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.RESOURCES_TOKEN }}
        run: bash scripts/descargar-resources.sh image

      - name: Guardar cache de la imagen EROFS (N3)
        if: inputs.experiment == 'N3' && steps.cache-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            mirror-v2/image
            mirror-v2/image_fetch.js
          key: image-v107-3726687b

      - name: Correr experimento ${{ inputs.experiment }}
        env:
          TWOYI_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bash scripts/run-experiment.sh ${{ inputs.experiment }}

      - name: Verificar linea NEO_ENGINE requested=
        if: always()
        run: |
          echo "--- NEO_ENGINE requested= ---"
          grep -h "NEO_ENGINE requested=" runs/${{ inputs.experiment }}/console.jsonl | tail -2 || echo "SIN LINEA NEO_ENGINE requested= en console.jsonl"
          echo "--- lineas NEO_AOT: $(grep -c 'NEO_AOT' runs/${{ inputs.experiment }}/console.jsonl || true) ---"
          echo "--- summary.json ---"
          cat runs/${{ inputs.experiment }}/summary.json 2>/dev/null | python3 -c "import json,sys; s=json.load(sys.stdin); print({k: s.get(k) for k in ['booted','crashed','guestRatio','guestMaxS','wasmPeakMB','chromeRssPeakMB','engineRequested','engineStatsLast','aotLines']})" || echo "sin summary.json"
          test -n "$(grep -h 'NEO_ENGINE requested=' runs/${{ inputs.experiment }}/console.jsonl | head -1)" || { echo "FALLO: no se capturo la linea NEO_ENGINE requested= (el motor no arranco o el servido fallo)"; exit 1; }

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.experiment }}-resultados
          path: |
            runs/${{ inputs.experiment }}/summary.json
            runs/${{ inputs.experiment }}/harness-exit.txt
            runs/${{ inputs.experiment }}/console.jsonl
            runs/${{ inputs.experiment }}/status.jsonl
            runs/${{ inputs.experiment }}/page-log.txt
            runs/${{ inputs.experiment }}/chrome.log
            runs/${{ inputs.experiment }}/server.log
            runs/${{ inputs.experiment }}/shots/
          if-no-files-found: warn
          retention-days: 30
